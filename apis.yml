name: uBEAM
description: uBeam was an ultrasonic wireless power startup founded in 2011 by Meredith
  Perry and headquartered in Marina del Rey, California. It raised roughly $26 million
  from Andreessen Horowitz, Upfront Ventures, Founders Fund, Mark Cuban, and Marissa
  Mayer to charge devices over the air using 45-75 kHz phased-array ultrasound. The
  company rebranded as SonicEnergy in December 2018 and went defunct on February 5,
  2024, without shipping a commercial product. It published no developer APIs, SDKs,
  or documentation, and both ubeam.com and sonicenergy.com are now parked domains.
